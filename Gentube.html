<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrenTube - Biru Terang Anti Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f9ff; color: #1e3a8a; }
        .blue-gradient { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .video-card { background: white; transition: all 0.3s ease; border: 1px solid #dbeafe; }
        .video-card:hover { transform: translateY(-5px); shadow-xl; border-color: #3b82f6; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #playerModal { backdrop-filter: blur(15px); background: rgba(219, 234, 254, 0.8); }
    </style>
</head>
<body>

    <div id="playerModal" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl bg-white rounded-3xl overflow-hidden shadow-2xl border-4 border-blue-500">
            <div class="flex justify-between items-center p-4 bg-blue-500 text-white">
                <h3 id="modalTitle" class="font-bold truncate">Memutar Video...</h3>
                <button onclick="closePlayer()" class="bg-white text-blue-600 px-4 py-1 rounded-full font-bold hover:bg-red-500 hover:text-white transition">Tutup X</button>
            </div>
            <div class="relative w-full pb-[56.25%] bg-black">
                <iframe id="videoFrame" class="absolute top-0 left-0 w-full h-full" 
                    src="" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
            </div>
            <div class="p-4 bg-blue-50 flex flex-col md:flex-row justify-between items-center gap-3">
                <p class="text-blue-700 text-sm font-medium"><i class="fa fa-info-circle"></i> Jika video Error 153, klik tombol biru di samping.</p>
                <a id="externalLink" href="#" target="_blank" class="blue-gradient text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-blue-300 transition active:scale-95">
                    BUKA DI APLIKASI YOUTUBE <i class="fa fa-external-link-alt ml-2"></i>
                </a>
            </div>
        </div>
    </div>

    <nav class="blue-gradient text-white p-4 sticky top-0 z-50 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 px-6 md:px-16">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="bg-white p-2 rounded-2xl shadow-inner">
                <i class="fab fa-youtube text-blue-600 text-2xl"></i>
            </div>
            <span class="text-2xl font-black tracking-tighter">GREN<span class="text-blue-200">TUBE</span></span>
        </div>

        <div class="flex-1 w-full max-w-2xl relative">
            <input id="searchInput" type="text" placeholder="Cari video seru di sini..." 
                class="w-full bg-white/20 border border-white/30 rounded-full py-3 px-6 pl-12 focus:outline-none focus:bg-white focus:text-blue-900 transition-all placeholder-blue-100 focus:placeholder-gray-400">
            <i class="fa fa-search absolute left-4 top-4 text-blue-100"></i>
        </div>

        <div class="flex gap-4 items-center">
            <div class="w-10 h-10 bg-white/20 rounded-full border border-white/50 flex items-center justify-center font-bold">G</div>
        </div>
    </nav>

    <main class="p-6 md:px-16">
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <script>
        const API_KEY = "AIzaSyB_D6q33dpDNb_S7kCHzjHadaZmd1jc7Kc";
        const videoGrid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');

        async function fetchVideos(query = 'berita terkini indonesia') {
            videoGrid.innerHTML = '<div class="col-span-full text-center p-10 font-bold text-blue-500">Mencari Video...</div>';
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
                const data = await response.json();
                renderVideos(data.items);
            } catch (err) {
                videoGrid.innerHTML = '<p class="text-red-500">Gagal memuat data.</p>';
            }
        }

        function renderVideos(videos) {
            videoGrid.innerHTML = '';
            videos.forEach(item => {
                const id = item.id.videoId;
                const snip = item.snippet;
                videoGrid.innerHTML += `
                    <div class="video-card rounded-3xl overflow-hidden cursor-pointer shadow-lg shadow-blue-100" onclick="openPlayer('${id}', '${snip.title.replace(/'/g, "\\'")}')">
                        <div class="relative">
                            <img src="${snip.thumbnails.high.url}" class="w-full aspect-video object-cover">
                            <div class="absolute bottom-2 right-2 bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded-lg">HD</div>
                        </div>
                        <div class="p-5 flex gap-3">
                            <div class="w-10 h-10 blue-gradient rounded-2xl flex-shrink-0 flex items-center justify-center font-bold text-white shadow-md">${snip.channelTitle.charAt(0)}</div>
                            <div>
                                <h3 class="font-bold text-blue-900 line-clamp-2 leading-tight text-sm">${snip.title}</h3>
                                <p class="text-xs text-blue-400 mt-2 font-medium">${snip.channelTitle} <i class="fa fa-check-circle"></i></p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openPlayer(id, title) {
            const modal = document.getElementById('playerModal');
            const frame = document.getElementById('videoFrame');
            const mTitle = document.getElementById('modalTitle');
            const exLink = document.getElementById('externalLink');

            mTitle.innerText = title;
            exLink.href = `https://www.youtube.com/watch?v=${id}`;
            
            // Trik agar bisa diputar di web (Gunakan origin)
            const origin = window.location.href.includes('http') ? window.location.origin : 'https://www.youtube.com';
            frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&origin=${origin}&enablejsapi=1&rel=0`;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('videoFrame').src = ""; 
            document.body.style.overflow = 'auto';
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== "") {
                fetchVideos(searchInput.value);
            }
        });

        fetchVideos();
    </script>
</body>
</html>
